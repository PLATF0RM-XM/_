<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة تحكم الإدارة</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#081c3a,#0b2c5d);color:#fff}
.container{max-width:480px;margin:60px auto;background:rgba(255,255,255,0.1);backdrop-filter:blur(12px);padding:25px;border-radius:16px}
input,button,select{width:100%;padding:14px;margin:10px 0;border:none;border-radius:10px;font-size:15px;box-sizing:border-box}
input{background:#fff;color:#000}
select{background:#1c2d52;color:#fff}
button{background:#00b05c;color:#fff;font-weight:bold;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{padding:10px;border-bottom:1px solid rgba(255,255,255,.2);text-align:center}
img{max-width:100%;border-radius:10px}
.danger{background:#c0392b}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);align-items:center;justify-content:center;z-index:999}
.modal-inner{background:#fff;padding:15px;border-radius:12px;max-width:90%;text-align:center}
.modal-inner button{background:#333;color:#fff;margin-top:10px}
</style>
</head>
<body>

<!-- Login -->
<div class="container" id="login">
  <h2 style="text-align:center">لوحة تحكم الإدارة</h2>
  <input id="email" type="email" placeholder="البريد الإلكتروني">
  <input id="password" type="password" placeholder="كلمة المرور">
  <button onclick="login()">تسجيل الدخول</button>
</div>

<!-- Panel -->
<div class="container" id="panel" style="display:none">
  <h3>إدارة صفقة</h3>
  <input id="dealId"    placeholder="رقم الصفقة">
  <input id="name"      placeholder="اسم العميل">
  <input id="investment" placeholder="مبلغ الاستثمار">
  <input id="profit"    placeholder="الأرباح">
  <input id="receipt"   placeholder="رقم استلام الأرباح">
  <input id="fees"      placeholder="الرسوم المطلوبة">
  <input id="hours"     placeholder="مدة السداد (ساعات)">
  <select id="paymentOpen">
    <option value="true">الدفع مفتوح</option>
    <option value="false">الدفع مغلق</option>
  </select>
  <button onclick="saveDeal()">حفظ / تعديل الصفقة</button>
  <button onclick="deleteDeal()" class="danger">حذف الصفقة</button>

  <hr style="margin:25px 0;opacity:.3">
  <h3>جميع الصفقات</h3>
  <table>
    <thead>
      <tr>
        <th>رقم الصفقة</th>
        <th>الاسم</th>
        <th>إثبات التحويل</th>
        <th>الحالة</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<!-- Modal لعرض صورة الإثبات -->
<div id="modal">
  <div class="modal-inner">
    <img id="proofImg" src="" alt="إثبات التحويل" style="max-height:80vh">
    <br>
    <button onclick="closeModal()">إغلاق</button>
  </div>
</div>

<script>
// ======= Firebase =======
const firebaseConfig = {
  apiKey: "AIzaSyCQreNBjTck897PId442n2xKmHmmnjRbuE",
  authDomain: "platform-xm.firebaseapp.com",
  projectId: "platform-xm",
  storageBucket: "platform-xm.firebasestorage.app",
  messagingSenderId: "762614490463",
  appId: "1:762614490463:web:59d233760c58817d88c2ea"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

// ======= Login =======
function login() {
  const email    = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  auth.signInWithEmailAndPassword(email, password)
    .then(() => {
      document.getElementById("login").style.display = "none";
      document.getElementById("panel").style.display = "block";
      loadDeals();
    })
    .catch(e => alert("خطأ: " + e.message));
}

// ======= Load All Deals =======
function loadDeals() {
  db.collection("deals").onSnapshot(snap => {
    let html = "";
    snap.forEach(doc => {
      const d = doc.data();
      const hasProof = !!d.paymentProof;
      html += `<tr>
        <td>${doc.id}</td>
        <td>${d.name || ""}</td>
        <td>
          ${hasProof
            ? `<button onclick="viewProof('${d.paymentProof}')">عرض</button>`
            : "<span style='opacity:.5'>لا يوجد</span>"}
        </td>
        <td>
          <select onchange="updateStatus('${doc.id}', this.value)">
            <option ${d.status==="قيد المراجعة"?"selected":""}>قيد المراجعة</option>
            <option ${d.status==="في انتظار مراجعة الإدارة"?"selected":""}>في انتظار مراجعة الإدارة</option>
            <option ${d.status==="تم السداد"?"selected":""}>تم السداد</option>
            <option ${d.status==="مرفوض"?"selected":""}>مرفوض</option>
          </select>
        </td>
      </tr>`;
    });
    document.getElementById("rows").innerHTML = html;
  });
}

function updateStatus(id, value) {
  db.collection("deals").doc(id).update({ status: value });
}

// ======= View Proof (URL stored in Firestore from Cloudinary) =======
function viewProof(url) {
  document.getElementById("proofImg").src = url;
  document.getElementById("modal").style.display = "flex";
}
function closeModal() {
  document.getElementById("modal").style.display = "none";
  document.getElementById("proofImg").src = "";
}

// ======= Save Deal =======
function saveDeal() {
  const id = document.getElementById("dealId").value.trim();
  if (!id) return alert("ادخل رقم الصفقة");
  db.collection("deals").doc(id).set({
    dealId:        id,
    name:          document.getElementById("name").value,
    investment:    Number(document.getElementById("investment").value),
    profit:        Number(document.getElementById("profit").value),
    fees:          Number(document.getElementById("fees").value),
    receipt:       document.getElementById("receipt").value,
    deadlineHours: Number(document.getElementById("hours").value),
    paymentOpen:   document.getElementById("paymentOpen").value === "true",
    status:        "في انتظار سداد الرسوم",
    paymentStart:  firebase.firestore.FieldValue.serverTimestamp(),
    createdAt:     firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true }).then(() => alert("تم حفظ الصفقة ✅"));
}

// ======= Delete Deal =======
function deleteDeal() {
  const id = document.getElementById("dealId").value.trim();
  if (!id) return;
  if (!confirm("متأكد من حذف الصفقة؟")) return;
  db.collection("deals").doc(id).delete().then(() => alert("تم حذف الصفقة 🗑️"));
}
</script>
</body>
</html>
