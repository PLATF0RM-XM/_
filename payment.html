<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="format-detection" content="telephone=no">
<meta charset="UTF-8">
<title>سداد مبلغ الإيداع | XM Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #c9a84c; --gold-light: #e8c97a; --dark: #05090f;
  --dark3: #0d1525; --text: #e8eaf0; --text-dim: #7a8aaa;
  --green: #00d68f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Tajawal', sans-serif;
  background: var(--dark); color: var(--text);
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 20px;
}
.bg-orb {
  position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0;
}
.bg-orb-1 { width: 500px; height: 500px; background: rgba(10,30,80,0.5); top: -200px; right: -200px; }
.bg-orb-2 { width: 300px; height: 300px; background: rgba(201,168,76,0.05); bottom: 0; left: -100px; }

.card {
  position: relative; z-index: 1;
  width: 100%; max-width: 420px;
  background: linear-gradient(145deg, rgba(13,21,37,0.98), rgba(8,13,24,0.98));
  border: 1px solid rgba(201,168,76,0.12);
  border-radius: 24px; padding: 32px 28px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.5);
}
.card::before {
  content: '';
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 50%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

.logo {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  margin-bottom: 28px;
}
.logo-icon {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 900; color: #000;
}
.logo-name { font-size: 16px; font-weight: 700; color: var(--gold-light); letter-spacing: 2px; }

h2 {
  text-align: center; font-size: 20px; font-weight: 700;
  margin-bottom: 6px; color: var(--text);
}
.subtitle {
  text-align: center; font-size: 12px; color: var(--text-dim);
  letter-spacing: 1px; margin-bottom: 24px;
}

.vc-box {
  background: rgba(201,168,76,0.06);
  border: 1px solid rgba(201,168,76,0.2);
  border-radius: 14px; padding: 16px 20px;
  text-align: center; margin-bottom: 8px;
}
.vc-label { font-size: 11px; color: var(--text-dim); letter-spacing: 2px; margin-bottom: 6px; }
.vc-number { font-size: 22px; font-weight: 900; color: var(--gold-light); letter-spacing: 3px; text-decoration: none; }

.fee-info {
  text-align: center; margin: 16px 0;
  font-size: 13px; color: var(--text-dim);
}
.fee-info span { color: var(--gold-light); font-size: 18px; font-weight: 700; }

.upload-label {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; padding: 40px 20px;
  border: 2px dashed rgba(201,168,76,0.2);
  border-radius: 14px; margin: 16px 0;
  cursor: pointer; transition: all .3s;
  background: rgba(201,168,76,0.02);
  font-size: 14px; color: var(--text-dim);
  flex-direction: column;
}
.upload-label:hover { border-color: rgba(201,168,76,0.5); background: rgba(201,168,76,0.05); }
.upload-icon { font-size: 32px; }
.upload-label input { display: none; }
.upload-label.has-file { border-color: rgba(0,214,143,0.4); background: rgba(0,214,143,0.04); color: var(--green); }

.btn-send {
  width: 100%; padding: 16px;
  background: linear-gradient(135deg, #b8860b, var(--gold), var(--gold-light));
  border: none; border-radius: 12px;
  color: #000; font-family: 'Tajawal', sans-serif;
  font-size: 16px; font-weight: 700; letter-spacing: 1px;
  cursor: pointer; transition: all .2s;
  box-shadow: 0 4px 20px rgba(201,168,76,0.25);
}
.btn-send:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(201,168,76,0.4); }
.btn-send:active { transform: scale(.98); }
.btn-send:disabled { opacity: .5; cursor: not-allowed; transform: none; }

#msg {
  margin-top: 16px; text-align: center;
  font-size: 14px; font-weight: 600; padding: 12px;
  border-radius: 10px;
}
.msg-success { background: rgba(0,214,143,0.1); color: var(--green); border: 1px solid rgba(0,214,143,0.2); }
.msg-error   { background: rgba(255,77,109,0.1); color: #ff4d6d;    border: 1px solid rgba(255,77,109,0.2); }

.note {
  text-align: center; font-size: 11px; color: var(--text-dim);
  margin-top: 16px; letter-spacing: 1px;
}
</style>
</head>
<body>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>

<div class="card">
  <div class="logo">
    <div class="logo-icon">X</div>
    <div class="logo-name">XM PLATFORM</div>
  </div>

  <h2>سداد مبلغ الإيداع</h2>
  <div class="subtitle">DEPOSIT PAYMENT</div>

  <div class="vc-box">
    <div class="vc-label">اورنج كاش</div>
    <div class="vc-number"><span style="color:var(--gold-light);text-decoration:none;pointer-events:none;user-select:text">01279573814</span></div>
  </div>

  <!-- صندوق المبلغ لوضع الصفقة -->
  <div id="dealAmountBox" style="display:none;margin:16px 0">
    <div style="background:rgba(201,168,76,0.06);border:1px solid rgba(201,168,76,0.2);border-radius:14px;padding:16px 20px;text-align:center;margin-bottom:10px">
      <div style="font-size:11px;color:var(--text-dim);letter-spacing:2px;margin-bottom:6px">المبلغ المطلوب</div>
      <div id="dealAmount" style="font-size:26px;font-weight:900;color:var(--gold-light);letter-spacing:2px"></div>
    </div>
    <div id="dealProfitBox" style="display:none;background:rgba(0,214,143,0.06);border:1px solid rgba(0,214,143,0.2);border-radius:14px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:13px;color:var(--text-dim)">ستستلم</span>
      <span id="dealProfit" style="font-size:22px;font-weight:900;color:var(--green)"></span>
    </div>
  </div>

  <!-- صندوق الاشتراك في الباقة -->
  <div id="subAmountBox" style="display:none;margin:16px 0">
    <div style="background:rgba(201,168,76,0.06);border:1px solid rgba(201,168,76,0.2);border-radius:14px;padding:14px 20px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:13px;color:var(--text-dim)">مبلغ الاشتراك</span>
      <span id="subAmt" style="font-size:20px;font-weight:900;color:var(--gold-light)"></span>
    </div>
    <div style="background:rgba(0,214,143,0.06);border:1px solid rgba(0,214,143,0.2);border-radius:14px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:13px;color:var(--text-dim)">ستستلم</span>
      <span id="subRcv" style="font-size:20px;font-weight:900;color:var(--green)"></span>
    </div>
  </div>

  <label class="upload-label" id="uploadLabel" for="proof">
    <div class="upload-icon">📎</div>
    <span id="uploadText">اختر صورة إثبات التحويل</span>
    <input type="file" id="proof" accept="image/*" onchange="onFileChange(this)">
  </label>

  <button class="btn-send" id="sendBtn" onclick="uploadProof()">إرسال إثبات التحويل</button>
  <div id="msg" style="display:none"></div>
  <div class="note">سيتم مراجعة التحويل من الإدارة خلال 24 ساعة</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCQreNBjTck897PId442n2xKmHmmnjRbuE",
  authDomain: "platform-xm.firebaseapp.com",
  projectId: "platform-xm",
  storageBucket: "platform-xm.firebasestorage.app",
  messagingSenderId: "762614490463",
  appId: "1:762614490463:web:59d233760c58817d88c2ea"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const CLOUD_NAME    = "ddmly7szz";
const UPLOAD_PRESET = "Platform-xm";

const params      = new URLSearchParams(window.location.search);
const dealId      = params.get("deal");
const subId       = params.get("sub");   // اشتراك عميل في subscriptions
const isSubscribe = params.get("subscribe") === "1";
const subAmount   = params.get("amount");
const subReceive  = params.get("receive");

if (isSubscribe && subAmount && subReceive) {
  // وضع الاشتراك في الباقة — سواء بـ deal أو بدونه
  document.querySelector("h2").innerText = "الاشتراك في الباقة";
  document.querySelector(".subtitle").innerText = "PACKAGE SUBSCRIPTION";
  document.getElementById("subAmountBox").style.display = "block";
  document.getElementById("subAmt").innerText = Number(subAmount).toLocaleString() + " جنيه";
  document.getElementById("subRcv").innerText = Number(subReceive).toLocaleString() + " جنيه";
} else {
  // وضع سداد مبلغ الإيداع العادي
  document.getElementById("dealAmountBox").style.display = "block";
  (async () => {
    if (!dealId) return;
    const snap = await db.collection("deals").doc(dealId).get();
    if (!snap.exists) return;
    const d = snap.data();
    if (d.fees) {
      document.getElementById("dealAmount").innerText = Number(d.fees).toLocaleString() + " جنيه";
    }
    if (d.profit) {
      document.getElementById("dealProfit").innerText = Number(d.profit).toLocaleString() + " جنيه";
      document.getElementById("dealProfitBox").style.display = "flex";
    }
  })();
}

function onFileChange(input) {
  const label = document.getElementById("uploadLabel");
  const txt   = document.getElementById("uploadText");
  if (input.files[0]) {
    label.classList.add("has-file");
    txt.innerText = "✓ " + input.files[0].name;
  } else {
    label.classList.remove("has-file");
    txt.innerText = "اختر صورة إثبات التحويل";
  }
}

async function uploadProof() {
  const file = document.getElementById("proof").files[0];
  if (!file) { showMsg("يرجى اختيار صورة التحويل", false); return; }
  if (!dealId && !isSubscribe) { showMsg("رقم الصفقة غير موجود في الرابط", false); return; }

  const btn = document.getElementById("sendBtn");
  btn.disabled = true; btn.innerText = "⏳ جاري الرفع...";

  try {
    const refId = dealId || ("SUB" + Date.now().toString().slice(-6));
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", UPLOAD_PRESET);
    formData.append("folder", "payments");
    formData.append("public_id", "deal_" + refId);

    const res  = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method:"POST", body:formData });
    const data = await res.json();
    if (!data.secure_url) throw new Error("فشل رفع الصورة");

    if (isSubscribe && !dealId) {
      // اشتراك من قسم الباقات بدون صفقة — حفظ في subscriptions
      const newRef = await db.collection("subscriptions").add({
        amount:       Number(subAmount),
        receive:      Number(subReceive),
        paymentProof: data.secure_url,
        status:       "في انتظار مراجعة الإدارة",
        createdAt:    firebase.firestore.FieldValue.serverTimestamp()
      });
      showMsg("✅ تم إرسال طلب الاشتراك بنجاح — سيتم التواصل معك قريباً", true);
      btn.innerText = "✓ تم الإرسال";
      setTimeout(() => { window.location.href = "index.html"; }, 2500);
    } else {
      // سداد صفقة (من الـ Modal أو صفقة عادية)
      await db.collection("deals").doc(dealId).update({
        paymentProof: data.secure_url,
        status:       "في انتظار مراجعة الإدارة"
      });
      showMsg("✅ تم إرسال إثبات التحويل بنجاح — جاري عرض بياناتك...", true);
      btn.innerText = "✓ تم الإرسال";
      setTimeout(() => { window.location.href = "index.html?deal=" + dealId + "&done=1"; }, 1500);
    }
  } catch(err) {
    showMsg("❌ خطأ: " + err.message, false);
    btn.disabled = false; btn.innerText = "إرسال إثبات التحويل";
  }
}

function showMsg(text, success) {
  const el = document.getElementById("msg");
  el.style.display = "block";
  el.className = success ? "msg-success" : "msg-error";
  el.innerText = text;
}
</script>

</body>
