<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="format-detection" content="telephone=no">
<meta charset="UTF-8">
<title>سداد مبلغ الإيداع | XM Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f; --surface:#12121a; --surface2:#1a1a26;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.12);
  --text:#f0f0f8; --muted:#6b6b8a;
  --accent:#7c6af5; --accent2:#5e4de8;
  --teal:#2dd4bf; --teal2:#14b8a6;
  --gold:#f59e0b; --green:#10b981; --red:#ef4444;
  --r:14px; --r2:20px; --r3:28px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
body::before{content:'';position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(124,106,245,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(124,106,245,0.04) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;}
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(80px);}
.orb-1{width:400px;height:400px;background:rgba(124,106,245,0.12);top:-100px;right:-100px;}
.orb-2{width:350px;height:350px;background:rgba(45,212,191,0.08);bottom:50px;left:-80px;}

.card{position:relative;z-index:1;width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r3);padding:32px 28px;box-shadow:0 32px 80px rgba(0,0,0,0.5);}
.card::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:50%;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);}

.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px;}
.logo-box{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--teal));display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:#fff;}
.logo-name{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:var(--text);letter-spacing:2px;}

h2{text-align:center;font-size:20px;font-weight:700;margin-bottom:6px;color:var(--text);}
.subtitle{text-align:center;font-size:12px;color:var(--muted);letter-spacing:2px;margin-bottom:24px;}

.num-box{background:rgba(124,106,245,0.07);border:1px solid rgba(124,106,245,0.2);border-radius:var(--r2);padding:16px 20px;text-align:center;margin-bottom:8px;}
.num-label{font-size:11px;color:var(--muted);letter-spacing:2px;margin-bottom:6px;}
.num-val{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--accent);letter-spacing:3px;}

.amount-box{background:rgba(245,158,11,0.06);border:1px solid rgba(245,158,11,0.18);border-radius:var(--r2);padding:16px 20px;text-align:center;margin-bottom:10px;}
.amount-label{font-size:11px;color:var(--muted);letter-spacing:2px;margin-bottom:6px;}
.amount-val{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:var(--gold);}

.profit-box{background:rgba(16,185,129,0.06);border:1px solid rgba(16,185,129,0.18);border-radius:var(--r2);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.profit-label{font-size:13px;color:var(--muted);}
.profit-val{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--green);}

.upload-zone{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:36px 20px;border:2px dashed rgba(124,106,245,0.2);border-radius:var(--r2);margin:16px 0;cursor:pointer;transition:all .3s;background:rgba(124,106,245,0.02);font-size:14px;color:var(--muted);}
.upload-zone:hover{border-color:rgba(124,106,245,0.45);background:rgba(124,106,245,0.05);}
.upload-zone.ok{border-color:rgba(16,185,129,0.4);background:rgba(16,185,129,0.04);color:var(--green);}
.upload-ico{font-size:30px;}
.upload-zone input{display:none;}

.btn-send{width:100%;padding:17px;background:linear-gradient(135deg,var(--accent2),var(--accent));border:none;border-radius:var(--r2);color:#fff;font-family:'Tajawal',sans-serif;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 4px 20px rgba(124,106,245,.3);}
.btn-send:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(124,106,245,.5);}
.btn-send:active{transform:scale(.98);}
.btn-send:disabled{opacity:.5;cursor:not-allowed;transform:none;}

#msg{margin-top:16px;text-align:center;font-size:14px;font-weight:600;padding:12px;border-radius:var(--r);}
.ok-msg{background:rgba(16,185,129,.1);color:var(--green);border:1px solid rgba(16,185,129,.2);}
.err-msg{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2);}

.note{text-align:center;font-size:11px;color:var(--muted);margin-top:16px;letter-spacing:1px;}

.fab{position:fixed;left:16px;z-index:9999;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:transform .2s,box-shadow .2s;}
.fab:hover{transform:scale(1.1);}
.fab-fb{bottom:20px;background:#1877f2;box-shadow:0 4px 18px rgba(24,119,242,.45);}
.fab-fb:hover{box-shadow:0 8px 28px rgba(24,119,242,.65);}
.fab-info{bottom:82px;background:linear-gradient(135deg,var(--accent),var(--teal));box-shadow:0 4px 18px rgba(124,106,245,.4);font-size:20px;}
.fab-info:hover{box-shadow:0 8px 28px rgba(124,106,245,.6);}
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="card">
  <div class="logo">
    <div class="logo-box">XM</div>
    <div class="logo-name">XM PLATFORM</div>
  </div>

  <h2 id="pgTitle">سداد مبلغ الإيداع</h2>
  <div class="subtitle" id="pgSub">DEPOSIT PAYMENT</div>

  <div class="num-box">
    <div class="num-label" id="numLabel">اورنج كاش</div>
    <div class="num-val">01279573814</div>
  </div>

  <div id="dealAmtBox" style="display:none;margin:16px 0">
    <div class="amount-box">
      <div class="amount-label" id="lblReq">المبلغ المطلوب</div>
      <div class="amount-val" id="dealAmt"></div>
    </div>
    <div class="profit-box" id="dealProfBox" style="display:none">
      <span class="profit-label" id="lblWill">ستستلم</span>
      <span class="profit-val" id="dealProf"></span>
    </div>
  </div>

  <div id="subAmtBox" style="display:none;margin:16px 0">
    <div class="amount-box">
      <div class="amount-label" id="lblSubAmt">مبلغ الاشتراك</div>
      <div class="amount-val" id="subAmt"></div>
    </div>
    <div class="profit-box">
      <span class="profit-label" id="lblWill2">ستستلم</span>
      <span class="profit-val" id="subRcv"></span>
    </div>
  </div>

  <label class="upload-zone" id="upZone" for="proof">
    <div class="upload-ico">📎</div>
    <span id="upTxt">اختر صورة إثبات التحويل</span>
    <input type="file" id="proof" accept="image/*" onchange="onFile(this)">
  </label>

  <button class="btn-send" id="sendBtn" onclick="doUpload()">إرسال إثبات التحويل</button>
  <div id="msg" style="display:none"></div>
  <div class="note" id="noteT">سيتم مراجعة التحويل من الإدارة خلال 24 ساعة</div>
</div>

<a class="fab fab-fb" href="https://www.facebook.com/share/1BqAEE93yu/?mibextid=wwXIfr" target="_blank">
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
</a>
<a class="fab fab-info" href="about.html">ℹ️</a>

<script>
const T={ar:{dir:"rtl",depositTitle:"سداد مبلغ الإيداع",depositSub:"DEPOSIT PAYMENT",subTitle:"الاشتراك في الباقة",subSub:"PACKAGE SUBSCRIPTION",numLabel:"اورنج كاش",lblReq:"المبلغ المطلوب",lblWill:"ستستلم",lblSubAmt:"مبلغ الاشتراك",upTxt:"اختر صورة إثبات التحويل",sendBtn:"إرسال إثبات التحويل",uploading:"⏳ جاري الرفع...",sent:"✓ تم الإرسال",note:"سيتم مراجعة التحويل من الإدارة خلال 24 ساعة",noFile:"يرجى اختيار صورة التحويل",noDeal:"رقم الصفقة غير موجود",successSub:"✅ تم إرسال طلب الاشتراك بنجاح",successDeal:"✅ تم إرسال إثبات التحويل — جاري عرض بياناتك...",failImg:"فشل رفع الصورة",errPfx:"❌ خطأ: ",cur:" جنيه"},
en:{dir:"ltr",depositTitle:"Pay Deposit Amount",depositSub:"DEPOSIT PAYMENT",subTitle:"Package Subscription",subSub:"PACKAGE SUBSCRIPTION",numLabel:"Orange Cash",lblReq:"AMOUNT REQUIRED",lblWill:"You'll Receive",lblSubAmt:"Subscription Amount",upTxt:"Choose transfer proof image",sendBtn:"Send Transfer Proof",uploading:"⏳ Uploading...",sent:"✓ Sent",note:"Transfer will be reviewed within 24 hours",noFile:"Please choose a transfer image",noDeal:"Deal number not found in URL",successSub:"✅ Subscription sent — we'll contact you soon",successDeal:"✅ Transfer proof sent — loading your data...",failImg:"Image upload failed",errPfx:"❌ Error: ",cur:" EGP"}};

const lang=localStorage.lang||(navigator.language.startsWith("en")?"en":"ar"),t=T[lang];
document.documentElement.dir=t.dir; document.documentElement.lang=lang;
const s=(id,v)=>{ const e=document.getElementById(id); if(e) e.innerText=v; };
s("numLabel",t.numLabel); s("lblReq",t.lblReq); s("lblWill",t.lblWill); s("lblWill2",t.lblWill);
s("lblSubAmt",t.lblSubAmt); s("upTxt",t.upTxt); s("sendBtn",t.sendBtn); s("noteT",t.note);

const FB={apiKey:"AIzaSyCQreNBjTck897PId442n2xKmHmmnjRbuE",authDomain:"platform-xm.firebaseapp.com",projectId:"platform-xm",storageBucket:"platform-xm.firebasestorage.app",messagingSenderId:"762614490463",appId:"1:762614490463:web:59d233760c58817d88c2ea"};
firebase.initializeApp(FB);
const db=firebase.firestore();
const CLOUD="ddmly7szz", PRESET="Platform-xm";
const p=new URLSearchParams(window.location.search);
const dealId=p.get("deal"), isSubscribe=p.get("subscribe")==="1", subAmount=p.get("amount"), subReceive=p.get("receive");

if(isSubscribe&&subAmount&&subReceive){
  document.getElementById("pgTitle").innerText=t.subTitle;
  document.getElementById("pgSub").innerText=t.subSub;
  document.getElementById("subAmtBox").style.display="block";
  document.getElementById("subAmt").innerText=Number(subAmount).toLocaleString()+t.cur;
  document.getElementById("subRcv").innerText=Number(subReceive).toLocaleString()+t.cur;
} else {
  document.getElementById("pgTitle").innerText=t.depositTitle;
  document.getElementById("pgSub").innerText=t.depositSub;
  document.getElementById("dealAmtBox").style.display="block";
  (async()=>{
    if(!dealId) return;
    const snap=await db.collection("deals").doc(dealId).get(); if(!snap.exists) return;
    const d=snap.data();
    if(d.fees){ document.getElementById("dealAmt").innerText=Number(d.fees).toLocaleString()+t.cur; }
    if(d.profit){ document.getElementById("dealProf").innerText=Number(d.profit).toLocaleString()+t.cur; document.getElementById("dealProfBox").style.display="flex"; }
  })();
}

function onFile(input){
  const z=document.getElementById("upZone"), tx=document.getElementById("upTxt");
  if(input.files[0]){ z.classList.add("ok"); tx.innerText="✓ "+input.files[0].name; }
  else{ z.classList.remove("ok"); tx.innerText=t.upTxt; }
}

async function doUpload(){
  const file=document.getElementById("proof").files[0];
  if(!file){ showMsg(t.noFile,false); return; }
  if(!dealId&&!isSubscribe){ showMsg(t.noDeal,false); return; }
  const btn=document.getElementById("sendBtn"); btn.disabled=true; btn.innerText=t.uploading;
  try{
    const refId=dealId||("SUB"+Date.now().toString().slice(-6));
    const fd=new FormData(); fd.append("file",file); fd.append("upload_preset",PRESET); fd.append("folder","payments"); fd.append("public_id","deal_"+refId);
    const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/image/upload`,{method:"POST",body:fd});
    const data=await res.json(); if(!data.secure_url) throw new Error(t.failImg);
    if(isSubscribe&&!dealId){
      await db.collection("subscriptions").add({amount:Number(subAmount),receive:Number(subReceive),paymentProof:data.secure_url,status:"في انتظار مراجعة الإدارة",createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      showMsg(t.successSub,true); btn.innerText=t.sent;
      setTimeout(()=>window.location.href="thankyou.html",1500);
    } else {
      await db.collection("deals").doc(dealId).update({paymentProof:data.secure_url,status:"في انتظار مراجعة الإدارة"});
      showMsg(t.successDeal,true); btn.innerText=t.sent;
      setTimeout(()=>window.location.href="thankyou.html?deal="+dealId,1500);
    }
  } catch(err){ showMsg(t.errPfx+err.message,false); btn.disabled=false; btn.innerText=t.sendBtn; }
}

function showMsg(txt,ok){
  const e=document.getElementById("msg"); e.style.display="block";
  e.className=ok?"ok-msg":"err-msg"; e.innerText=txt;
}
</script>
</body>
</html>
