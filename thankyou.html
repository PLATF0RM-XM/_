<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="format-detection" content="telephone=no">
<title>شكراً | XM Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #c9a84c; --gold-light: #e8c97a; --dark: #05090f;
  --dark2: #080d18; --text: #e8eaf0; --text-dim: #7a8aaa;
  --green: #00d68f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Tajawal', sans-serif;
  background: var(--dark); color: var(--text);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}

/* BG */
.bg-orb { position: fixed; border-radius: 50%; filter: blur(140px); pointer-events: none; z-index: 0; }
.bg-orb-1 { width: 500px; height: 500px; background: rgba(0,214,143,0.06); top: -150px; right: -150px; }
.bg-orb-2 { width: 400px; height: 400px; background: rgba(201,168,76,0.05); bottom: -100px; left: -100px; }

/* PARTICLES */
.particles { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
.particle {
  position: absolute; width: 6px; height: 6px; border-radius: 50%;
  animation: floatUp 4s ease-in forwards;
}
@keyframes floatUp {
  0%   { transform: translateY(100vh) scale(0); opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { transform: translateY(-20vh) scale(1); opacity: 0; }
}

/* CARD */
.card {
  position: relative; z-index: 10;
  background: linear-gradient(145deg, rgba(13,21,37,0.98), rgba(8,13,24,0.98));
  border: 1px solid rgba(201,168,76,0.15);
  border-radius: 28px; padding: 48px 32px 40px;
  max-width: 380px; width: calc(100% - 32px);
  text-align: center;
  box-shadow: 0 0 60px rgba(0,214,143,0.06), 0 0 120px rgba(201,168,76,0.04);
  animation: cardIn .6s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes cardIn {
  from { transform: translateY(40px) scale(.95); opacity: 0; }
  to   { transform: translateY(0) scale(1); opacity: 1; }
}
.card::before {
  content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 60%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--green), transparent);
}

/* CHECKMARK */
.check-wrap {
  width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 24px;
  background: rgba(0,214,143,0.08);
  border: 2px solid rgba(0,214,143,0.3);
  display: flex; align-items: center; justify-content: center;
  animation: checkPop .5s .3s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes checkPop {
  from { transform: scale(0); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}
.check-icon { font-size: 36px; }

/* TITLE */
.title {
  font-size: 24px; font-weight: 900; margin-bottom: 8px;
  background: linear-gradient(135deg, var(--green), #00ffb3);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  animation: fadeUp .5s .4s both;
}
.subtitle {
  font-size: 13px; color: var(--text-dim); letter-spacing: 2px;
  margin-bottom: 28px;
  animation: fadeUp .5s .5s both;
}
@keyframes fadeUp {
  from { transform: translateY(12px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}

/* DEAL BOX */
.deal-box {
  background: rgba(201,168,76,0.06);
  border: 1px solid rgba(201,168,76,0.2);
  border-radius: 14px; padding: 16px 20px;
  margin-bottom: 20px;
  animation: fadeUp .5s .6s both;
}
.deal-label { font-size: 11px; color: var(--text-dim); letter-spacing: 2px; margin-bottom: 6px; }
.deal-id { font-size: 22px; font-weight: 900; color: var(--gold-light); letter-spacing: 3px; }

/* INFO BOXES */
.info-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; animation: fadeUp .5s .7s both; }
.info-item {
  display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,0.02); border-radius: 10px; padding: 12px 14px;
  font-size: 13px; color: var(--text-dim); text-align: right;
}
.info-item span:first-child { font-size: 18px; }

/* BUTTONS */
.btn-primary {
  width: 100%; padding: 16px;
  background: linear-gradient(135deg, #b8860b, var(--gold), var(--gold-light));
  border: none; border-radius: 14px;
  color: #000; font-family: 'Tajawal', sans-serif;
  font-size: 15px; font-weight: 700; cursor: pointer;
  box-shadow: 0 4px 20px rgba(201,168,76,0.3);
  transition: all .2s; margin-bottom: 10px;
  animation: fadeUp .5s .8s both;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(201,168,76,0.45); }
.btn-secondary {
  width: 100%; padding: 14px;
  background: rgba(0,214,143,0.08); border: 1px solid rgba(0,214,143,0.2);
  border-radius: 14px; color: var(--green);
  font-family: 'Tajawal', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer;
  transition: all .2s;
  animation: fadeUp .5s .9s both;
}
.btn-secondary:hover { background: rgba(0,214,143,0.15); }
</style>
</head>
<body>

<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="particles" id="particles"></div>

<div class="card">
  <div class="check-wrap"><div class="check-icon">✅</div></div>
  <div class="title" id="titleText">تم إرسال التحويل!</div>
  <div class="subtitle" id="subtitleText">TRANSFER SENT SUCCESSFULLY</div>

  <div class="deal-box" id="dealBox" style="display:none">
    <div class="deal-label" id="dealLbl">رقم الصفقة</div>
    <div class="deal-id" id="dealNum"></div>
  </div>

  <div class="info-list">
    <div class="info-item">
      <span>⏳</span>
      <span id="info1">إثبات التحويل وصل للإدارة وجاري المراجعة</span>
    </div>
    <div class="info-item">
      <span>💰</span>
      <span id="info2">ستستلم أرباحك خلال ساعة من تأكيد الإدارة</span>
    </div>
    <div class="info-item">
      <span>📋</span>
      <span id="info3">احتفظ برقم صفقتك لمتابعة الحالة</span>
    </div>
  </div>

  <button class="btn-primary" id="btnTrack" onclick="goTrack()">📊 متابعة الصفقة</button>
  <button class="btn-secondary" id="btnHome" onclick="goHome()">🏠 الصفحة الرئيسية</button>
</div>

<script>
// ===== Translations =====
const t = {
  ar: {
    dir:"rtl",
    title:"تم إرسال التحويل!", subtitle:"TRANSFER SENT SUCCESSFULLY",
    dealLbl:"رقم الصفقة",
    info1:"إثبات التحويل وصل للإدارة وجاري المراجعة",
    info2:"ستستلم أرباحك خلال ساعة من تأكيد الإدارة",
    info3:"احتفظ برقم صفقتك لمتابعة الحالة",
    btnTrack:"📊 متابعة الصفقة", btnHome:"🏠 الصفحة الرئيسية"
  },
  en: {
    dir:"ltr",
    title:"Transfer Sent!", subtitle:"TRANSFER SENT SUCCESSFULLY",
    dealLbl:"TRADE NUMBER",
    info1:"Your transfer proof has been received and is under review",
    info2:"You'll receive your profits within 1 hour of admin confirmation",
    info3:"Keep your trade number to track your status",
    btnTrack:"📊 Track Trade", btnHome:"🏠 Home"
  }
};

const lang = localStorage.lang || (navigator.language.startsWith("en") ? "en" : "ar");
const tx = t[lang];
document.documentElement.dir = tx.dir;
document.documentElement.lang = lang;
document.getElementById("titleText").innerText    = tx.title;
document.getElementById("subtitleText").innerText = tx.subtitle;
document.getElementById("dealLbl").innerText      = tx.dealLbl;
document.getElementById("info1").innerText        = tx.info1;
document.getElementById("info2").innerText        = tx.info2;
document.getElementById("info3").innerText        = tx.info3;
document.getElementById("btnTrack").innerText     = tx.btnTrack;
document.getElementById("btnHome").innerText      = tx.btnHome;

// رقم الصفقة من URL
const params = new URLSearchParams(window.location.search);
const dealId = params.get("deal");
if (dealId) {
  document.getElementById("dealBox").style.display = "block";
  document.getElementById("dealNum").innerText = dealId;
}

function goTrack() {
  window.location.href = dealId ? "index.html?deal=" + dealId : "index.html";
}
function goHome() {
  window.location.href = "index.html";
}

// Particles
const colors = ["#c9a84c","#00d68f","#e8c97a","#00ffb3"];
const container = document.getElementById("particles");
for (let i = 0; i < 20; i++) {
  const p = document.createElement("div");
  p.className = "particle";
  p.style.cssText = `
    left: ${Math.random()*100}%;
    background: ${colors[Math.floor(Math.random()*colors.length)]};
    animation-delay: ${Math.random()*3}s;
    animation-duration: ${3+Math.random()*2}s;
    width: ${4+Math.random()*6}px;
    height: ${4+Math.random()*6}px;
  `;
  container.appendChild(p);
}
</script>
